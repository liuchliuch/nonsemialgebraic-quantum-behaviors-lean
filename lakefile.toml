name = "nonsemialgebraicQuantumBehaviors"
version = "0.1.0"
defaultTargets = ["QuantumBehaviors", "Verification.Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f156f7abd91ac67adb22bf999e5a71ba22e22e41"

[[lean_lib]]
name = "QuantumBehaviors"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

# Separate libraries keep the specification's placeholders out of production imports.
[[lean_lib]]
name = "Verification.Solution"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "Verification.Challenge"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]
